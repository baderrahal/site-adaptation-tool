name: test

on:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m pytest python -v

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build dotnet/SiteAdaptation.sln -c Release
      - name: Run .NET tests
        shell: pwsh
        run: |
          dotnet test dotnet/SiteAdaptation.sln -c Release --no-build --logger trx --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trx = Get-ChildItem -Recurse -Path TestResults -Filter *.trx | Select-Object -First 1
          [xml]$xml = Get-Content $trx.FullName
          $total = [int]$xml.TestRun.ResultSummary.Counters.executed
          Write-Host "tests ran $total"
          if ($total -le 0) { throw "No .NET tests ran" }
