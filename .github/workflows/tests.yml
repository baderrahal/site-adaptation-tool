name: tests

# Runs on a pull request that is marked ready. test.yml stays beside this for the Linux legs of R346, python/tests/test_addin_projects.py reads it.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]

jobs:
  # The job main will require. A check that has nothing to score says NOT RUN in the step summary, and that is no pass.
  tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python -m pip install -r requirements.txt

      - name: pytest
        if: ${{ !cancelled() }}
        run: python -m pytest python -q

      - name: Self tests of the checks and hooks
        if: ${{ !cancelled() }}
        run: python -m pytest scripts/checks -q

      - name: Build
        if: ${{ !cancelled() }}
        run: dotnet build dotnet/SiteAdaptation.sln -c Release

      # net48 and net8.0 on code that does not need Revit. Each target must have run tests. The R347 worker tests on a 1 s time limit fail at random under load, so they run in job dotnet of test.yml and not here, Bader's order, steps/backlog.md. The other R347 tests stay here, PR 210 broke two of them and only the other job showed it.
      - name: dotnet test, net48 and net8.0
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet test dotnet/SiteAdaptation.Tests/SiteAdaptation.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults --filter "FullyQualifiedName!~WorkerRunTests.R347_the_launch_returns_at_once&FullyQualifiedName!~WorkerRunTests.R347_a_temporary_file_the_kill_cannot_delete&FullyQualifiedName!~WorkerRunTests.R347_a_kill_in_the_middle_of_the_commit&FullyQualifiedName!~WorkerRunTests.R347_a_time_limit_that_fires_after"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem -Recurse -Path TestResults -Filter *.trx)
          if ($files.Count -lt 2) { throw "No .NET tests ran on one of the two targets, trx files: $($files.Count)" }
          foreach ($trx in $files) {
            [xml]$xml = Get-Content $trx.FullName
            $total = [int]$xml.TestRun.ResultSummary.Counters.executed
            Write-Host "$($trx.Name) tests ran $total"
            if ($total -le 0) { throw "No .NET tests ran in $($trx.Name)" }
          }

      # The harness and the step tests of both languages. Parity on real inputs cannot run here, the real files are not on GitHub.
      - name: Parity on the steps
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python -m pytest python/tests/test_parity.py python/tests/test_build_steps.py python/tests/test_level_floor_steps.py python/tests/test_override_param_steps.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = dotnet test dotnet/SiteAdaptation.Tests/SiteAdaptation.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~ParityStepTests|FullyQualifiedName~BuildStepTests|FullyQualifiedName~LevelFloorStepTests|FullyQualifiedName~OverrideParameterStepTests"
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) { exit $code }
          # A filter that matches nothing exits 0, so a rename must not read as a pass
          $ran = @($out | Where-Object { $_ -match 'Passed:\s+[1-9]' })
          if ($ran.Count -lt 2) { throw "The parity tests did not run on both targets, result lines: $($ran.Count)" }
          "- NOT RUN parity on real inputs: the real files are not on GitHub" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Acceptance tests
        if: ${{ !cancelled() }}
        run: python scripts/checks/test_folder.py tests/acceptance

      - name: Golden tests
        if: ${{ !cancelled() }}
        run: python scripts/checks/test_folder.py tests/golden

      - name: Hold-out tests
        if: ${{ !cancelled() }}
        env:
          HOLDOUT_ANSWERS: ${{ secrets.HOLDOUT_ANSWERS }}
        run: python scripts/checks/holdout.py

      - name: Clean folder test
        if: ${{ !cancelled() }}
        run: python scripts/checks/clean_folder.py

      - name: Source tag check
        if: ${{ !cancelled() }}
        run: python scripts/checks/source_tags.py

      - name: Caller check
        if: ${{ !cancelled() }}
        run: python scripts/checks/caller_check.py

      - name: Rules docs check
        if: ${{ !cancelled() }}
        run: python scripts/checks/rules_docs.py

      - name: Folder rules check
        if: ${{ !cancelled() }}
        run: python scripts/checks/folder_rules.py

      - name: Revit result check
        if: ${{ !cancelled() }}
        run: python scripts/checks/revit_result.py

      - name: No attribution check
        if: ${{ !cancelled() }}
        run: python scripts/checks/no_attribution.py
